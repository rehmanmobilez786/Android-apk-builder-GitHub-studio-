name: Build Android APK (Installable App)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Prevents runaway parallel builds & resource exhaustion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Native APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.2 || true
          fi
          chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build step skipped, using debug APK"

      - name: Upload APK Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Android-App-Installable-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Android APK Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          body: |
            🚀 **Android APK Cloud Build Complete!**
            - **Run Number:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Target Android SDK:** 34
            - 📲 **Download Instructions:** Download `app-debug.apk` directly to your Android device and tap Install!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

